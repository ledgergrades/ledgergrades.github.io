<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ledger grades - Dashboard</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/sJt7pKb8/Chat-GPT-Image-Sep-10-2026-05-56-27-PM.png">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <h1>Ledger Grades</h1>
    <div class="topbar-right">
      <span class="pill-demo" id="demo-pill" hidden>sample data</span>
      <span class="user-tag" id="user-tag"></span>
      <a href="index.html" class="btn-ghost small" id="signout-link">Sign out</a>
    </div>
  </header>

  <main class="ledger-grades">
    <div class="ledger-grades-head">
      <span>Course</span>
      <span>Change</span>
      <span>Average</span>
    </div>
    <div id="ledger-grades-body"></div>
    <p id="empty-state" class="no-detail" hidden>
      No grades loaded — head back to <a href="index.html">sign in</a>.
    </p>

    <div class="stats-panel" id="stats-panel" hidden>
      <div class="stats-bar">
        <span id="stats-today">—</span>
        <span class="stats-sep">·</span>
        <span id="stats-total">—</span>
      </div>
      <button type="button" class="stats-toggle" id="stats-toggle">Last 7 days</button>
      <div class="stats-days" id="stats-days" hidden></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
